name: lint & typescript check

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mv _rnstorybook .rnstorybook && mv _storybook .storybook && mv _prettierrc.js .prettierrc.js
      - name: Install dependencies
        run: npm install
      - name: Lint code
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
